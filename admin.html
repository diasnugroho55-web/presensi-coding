<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin Presensi</title>

  <!-- 1. Tailwind CSS (Styling & Modern UI) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

  <!-- 2. Library QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- 3. Library Firebase (Database Real-time) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- 4. Library Export Excel (SheetJS) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header Dashboard -->
    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Dashboard Presensi Coding</h1>
        <p class="text-slate-500 text-sm">Kelola sesi pertemuan dan pantau kehadiran siswa secara real-time</p>
      </div>
      <button onclick="buatPertemuanBaru()" class="w-full md:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold rounded-xl shadow-md transition-all duration-150 flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Buka Pertemuan Baru
      </button>
    </header>

    <!-- Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Tampilan QR Code -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col items-center text-center">
        <h2 class="font-bold text-slate-800 text-lg mb-1">QR Code Presensi</h2>
        <p class="text-xs text-slate-400 mb-4">Siswa dapat melakukan scan QR di bawah ini</p>
        
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center justify-center min-h-[220px] min-w-[220px]">
          <div id="qrcode"></div>
        </div>

        <div class="mt-4 w-full bg-slate-50 p-3 rounded-lg border border-slate-200/60">
          <span class="text-xs text-slate-400 block font-medium">ID Sesi Aktif</span>
          <span id="sessionIdLabel" class="font-mono text-sm font-semibold text-indigo-600 break-all">-</span>
        </div>
      </div>

      <!-- Tabel Kehadiran Real-time -->
      <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
          <div>
            <h2 class="font-bold text-slate-800 text-lg">Daftar Kehadiran Siswa</h2>
            <span id="totalHadir" class="inline-block mt-1 bg-indigo-50 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-100">0 Siswa Hadir</span>
          </div>
          
          <button onclick="eksporKeExcel()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-medium text-sm rounded-xl shadow transition-all duration-150 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            Ekspor Excel
          </button>
        </div>

        <div class="overflow-x-auto flex-1">
          <table class="w-full text-left text-sm border-collapse">
            <thead>
              <tr class="border-b border-slate-200 text-slate-400 font-semibold text-xs uppercase bg-slate-50">
                <th class="py-3 px-4 rounded-l-lg">No</th>
                <th class="py-3 px-4">Waktu</th>
                <th class="py-3 px-4">Nama</th>
                <th class="py-3 px-4">Kelas</th>
                <th class="py-3 px-4 rounded-r-lg">No. Absen</th>
              </tr>
            </thead>
            <tbody id="tabelPresensi" class="divide-y divide-slate-100 text-slate-700">
              <tr>
                <td colspan="5" class="py-8 text-center text-slate-400 italic">Belum ada data presensi...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Konfigurasi Firebase Milik Anda
    const firebaseConfig = {
      apiKey: "AIzaSyBc3HdLkjHNW5ugDVNtFJktXteK6fCYCGE",
      authDomain: "presensi-coding-7f2bd.firebaseapp.com",
      projectId: "presensi-coding-7f2bd",
      storageBucket: "presensi-coding-7f2bd.firebasestorage.app",
      messagingSenderId: "559325095003",
      appId: "1:559325095003:web:f0edfe9d59bcd9baa50b7e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let qrGenerator = null;
    let dataPresensiSiswa = [];

    function buatPertemuanBaru() {
      const idSesiBaru = "SESI_" + Date.now();
      
      db.collection("sistem").doc("sesiAktif").set({
        sessionId: idSesiBaru,
        dibuatPada: new Date()
      }).then(() => {
        tampilkanQR(idSesiBaru);
        dengarkanPresensi(idSesiBaru);
      });
    }

    function tampilkanQR(sessionId) {
      document.getElementById("sessionIdLabel").innerText = sessionId;
      document.getElementById("qrcode").innerHTML = "";

      const linkSiswa = window.location.href.replace("admin.html", "siswa.html") + "?session=" + sessionId;

      qrGenerator = new QRCode(document.getElementById("qrcode"), {
        text: linkSiswa,
        width: 190,
        height: 190,
        colorDark: "#1e293b",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function dengarkanPresensi(sessionId) {
      db.collection("presensi")
        .where("sessionId", "==", sessionId)
        .onSnapshot((snapshot) => {
          const tbody = document.getElementById("tabelPresensi");
          const totalHadirLabel = document.getElementById("totalHadir");
          dataPresensiSiswa = [];
          
          if (snapshot.empty) {
            tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 italic">Belum ada siswa yang presensi.</td></tr>`;
            totalHadirLabel.innerText = "0 Siswa Hadir";
            return;
          }

          tbody.innerHTML = "";
          let nomor = 1;
          
          snapshot.forEach((doc) => {
            const data = doc.data();
            const waktuFormat = data.waktu ? new Date(data.waktu.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '-';
            
            dataPresensiSiswa.push({
              "No": nomor,
              "Waktu Presensi": waktuFormat,
              "Nama Siswa": data.nama,
              "Kelas": data.kelas,
              "No. Absen": data.noAbsen
            });

            const row = `
              <tr class="hover:bg-slate-50 transition-colors">
                <td class="py-3 px-4 font-medium">${nomor++}</td>
                <td class="py-3 px-4 text-slate-500">${waktuFormat}</td>
                <td class="py-3 px-4 font-semibold text-slate-900">${data.nama}</td>
                <td class="py-3 px-4"><span class="bg-slate-100 text-slate-700 font-medium px-2.5 py-1 rounded-md text-xs border border-slate-200">${data.kelas}</span></td>
                <td class="py-3 px-4 font-mono text-slate-600">${data.noAbsen}</td>
              </tr>
            `;
            tbody.innerHTML += row;
          });

          totalHadirLabel.innerText = `${snapshot.size} Siswa Hadir`;
        });
    }

    function eksporKeExcel() {
      if (dataPresensiSiswa.length === 0) {
        alert("Belum ada data presensi yang bisa diekspor!");
        return;
      }

      const idSesi = document.getElementById("sessionIdLabel").innerText;
      const worksheet = XLSX.utils.json_to_sheet(dataPresensiSiswa);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Presensi");

      XLSX.writeFile(workbook, `Data_Presensi_${idSesi}.xlsx`);
    }
  </script>
</body>
</html>
